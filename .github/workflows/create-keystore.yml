name: Створити ключ підпису (один раз)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Згенерувати ключ
        run: |
          set -e
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore out/myday.keystore -alias myday \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=MyDay, O=Personal"
          echo -n "$PASS" > out/KEYSTORE_PASSWORD.txt
          base64 -w0 out/myday.keystore > out/KEYSTORE_BASE64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 3
